name: Check setup
# Run this after adding the secrets: it tests Gemini, YouTube, Telegram and the free voice, and tells you what's missing.
on:
  workflow_dispatch:
    inputs:
      test_video:
        description: "Also make one free AI video test clip and send it to Telegram (uses one of today's free clips)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          if [ "${{ inputs.test_video }}" = "true" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; fi
          pip install -q -r requirements.txt
          pip install -q piper-tts || echo "free voice engine not installed"
      - name: Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_KEY: ${{ secrets.GEMINI_PAID_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FREE_VIDEO: ${{ vars.FREE_VIDEO || 'auto' }}
          FREE_VIDEO_SPACE: ${{ vars.FREE_VIDEO_SPACE || 'Lightricks/LTX-2-3' }}
          TEST_VIDEO: ${{ inputs.test_video && '--video' || '' }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          TTS_MODEL: ${{ vars.TTS_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python -m agent.main check $TEST_VIDEO
      - name: Keep the test clip
        if: ${{ always() && inputs.test_video }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: free-video-test
          path: /tmp/free-video-test.mp4
          if-no-files-found: ignore
          retention-days: 3
