name: Make Shorts
# Every morning: one story Short (20-35 s) and one loop Short (5-12 s), sent to you on Telegram for approval.
on:
  schedule:
    - cron: "41 0 * * *"   # 06:11 IST every day
  workflow_dispatch:
    inputs:
      kind:
        description: "What to make"
        type: choice
        options: [both, story, loop]
        default: both
      topic:
        description: "Topic (leave empty and the strategist chooses)"
        required: false
        default: ""
      pictures:
        description: "Pictures (auto = Gemini AI if billing is on, else free AI, plus real archive photos)"
        type: choice
        options: [auto, free, archive, gemini]
        default: auto
      dry_run:
        description: "Test only (send to Telegram, don't keep or upload)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: make-shorts
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt
          pip install -q piper-tts || echo "free voice engine not installed"
      - name: Make the Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          TTS_MODEL: ${{ vars.TTS_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          PICTURES: ${{ inputs.pictures || vars.PICTURES || 'auto' }}
          AI_PICTURES_MAX: ${{ vars.SHORTS_AI_PICTURES_MAX || '0' }}
          VOICE: ${{ vars.VOICE || 'auto' }}
          MUSIC: ${{ vars.MUSIC || 'on' }}
          CINEMATIC: ${{ vars.CINEMATIC || 'auto' }}
          CINE_FORMATS: ${{ vars.CINE_FORMATS || 'pov,trailer' }}
          VIDEO_RESOLUTION: ${{ vars.VIDEO_RESOLUTION || '720p' }}
          VIDEO_MODEL: ${{ vars.VIDEO_MODEL || 'gemini-omni-1.1-flash,gemini-omni-flash' }}
          SHORT_VIDEO_BUDGET: ${{ vars.SHORT_VIDEO_BUDGET || '3' }}
          LOOP_VIDEO_BUDGET: ${{ vars.LOOP_VIDEO_BUDGET || '1' }}
          MOVIE_VIDEO_BUDGET: ${{ vars.MOVIE_VIDEO_BUDGET || '3' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          KIND: ${{ inputs.kind || 'both' }}
          TOPIC: ${{ inputs.topic }}
        run: python -m agent.main make --kind "$KIND" --topic "$TOPIC"
      - name: Save the agent's memory
        if: always()
        run: bash scripts/save_state.sh "Shorts run ${{ github.run_number }}"
