name: Weekly report
# Monday 08:47 IST: progress to monetization, what worked, and follow-ups for videos that took off.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: pip install -q -r requirements.txt
      - name: Weekly report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          TTS_MODEL: ${{ vars.TTS_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python -m agent.main report
      - name: Save the agent's memory
        if: always()
        run: bash scripts/save_state.sh "Weekly report ${{ github.run_number }}"
